<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲み会 割り勘計算</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f6f7f9;color:#222}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;padding:9px;margin:4px;border:1px solid #ccc;border-radius:8px}button{background:#222;color:#fff;cursor:pointer}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}.result{font-size:1.1em;font-weight:700}.muted{color:#666;font-size:.9em}</style></head><body><h1>🍻 飲み会 割り勘計算</h1><p class="muted">役職による傾斜＋ソフトドリンクのみの人の酒代除外に対応</p><div class="card"><h2>1. 参加者</h2><div id="people"></div><button onclick="addPerson()">＋参加者追加</button></div><div class="card"><h2>2. 金額・明細</h2><div class="row"><label>合計 <input id="total" type="number" min="0" step="1" placeholder="例 50000"></label></div><table><thead><tr><th>品名</th><th>金額</th><th>酒類?</th><th></th></tr></thead><tbody id="items"></tbody></table><button onclick="addItem()">＋明細追加</button><p class="muted">※AWS Textractを接続するとレシート画像から明細・合計を読み取る構成にできます。</p></div><div class="card"><h2>3. 役職の係数</h2><div class="row"><label>課長 <input id="w0" type="number" value="1.50" step=".05"></label><label>課長代理 <input id="w1" type="number" value="1.30" step=".05"></label><label>主任 <input id="w2" type="number" value="1.15" step=".05"></label><label>主事 <input id="w3" type="number" value="1.00" step=".05"></label></div></div><div class="card"><button onclick="calc()">💰 割り勘を計算</button><div id="out"></div></div><script>const roles=['課長','課長代理','主任','主事'];let people=[],items=[];function addPerson(){people.push({name:'参加者'+(people.length+1),role:'主事',soft:false});renderPeople()}function renderPeople(){document.getElementById('people').innerHTML=people.map((p,i)=>'<div class="row"><input value="'+esc(p.name)+'" oninput="people['+i+'].name=this.value"><select onchange="people['+i+'].role=this.value">'+roles.map(r=>'<option '+(r==p.role?'selected':'')+'>'+r+'</option>').join('')+'</select><label><input type="checkbox" '+(p.soft?'checked':'')+' onchange="people['+i+'].soft=this.checked">ソフトのみ</label><button onclick="people.splice('+i+',1);renderPeople()">削除</button></div>').join('')}function addItem(){items.push({name:'',price:0,alcohol:false});renderItems()}function renderItems(){document.getElementById('items').innerHTML=items.map((x,i)=>'<tr><td><input value="'+esc(x.name)+'" oninput="items['+i+'].name=this.value"></td><td><input type="number" value="'+x.price+'" oninput="items['+i+'].price=+this.value"></td><td><input type="checkbox" '+(x.alcohol?'checked':'')+' onchange="items['+i+'].alcohol=this.checked"></td><td><button onclick="items.splice('+i+',1);renderItems()">削除</button></td></tr>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function calc(){if(!people.length)return document.getElementById('out').innerHTML='<p>参加者を追加してください。</p>';let total=+document.getElementById('total').value||0;let rows=items.filter(x=>x.price>0);let itemTotal=rows.reduce((a,x)=>a+x.price,0);if(!total&&itemTotal)total=itemTotal;if(!total)return document.getElementById('out').innerHTML='<p>合計金額を入力してください。</p>';let alcohol=rows.filter(x=>x.alcohol).reduce((a,x)=>a+x.price,0);let normal=Math.max(0,total-alcohol);let ws={課長:+w0.value,課長代理:+w1.value,主任:+w2.value,主事:+w3.value};let base=people.map(p=>({p,w:ws[p.role]||1})),normalSum=base.reduce((a,x)=>a+x.w,0),drinkers=base.filter(x=>!x.p.soft),alcoholSum=drinkers.reduce((a,x)=>a+x.w,0);if(alcohol>0&&!alcoholSum)return document.getElementById('out').innerHTML='<p>酒類を飲む参加者が必要です。</p>';let vals=base.map(x=>normal*x.w/normalSum+(x.p.soft?0:alcohol*x.w/alcoholSum));let rounded=vals.map(Math.floor),diff=Math.round(total)-rounded.reduce((a,b)=>a+b,0);for(let i=0;i<diff;i++)rounded[i%rounded.length]++;document.getElementById('out').innerHTML='<h3>結果</h3><table><tr><th>名前</th><th>役職</th><th>金額</th></tr>'+base.map((x,i)=>'<tr><td>'+esc(x.p.name)+'</td><td>'+x.p.role+(x.p.soft?'（ソフトのみ）':'')+'</td><td class="result">'+rounded[i].toLocaleString()+'円</td></tr>').join('')+'</table><p>合計 '+rounded.reduce((a,b)=>a+b,0).toLocaleString()+'円 ／ 酒類 '+Math.round(alcohol).toLocaleString()+'円</p>'}for(let i=0;i<4;i++)addPerson();addItem();renderPeople();renderItems();</script></body></html>
